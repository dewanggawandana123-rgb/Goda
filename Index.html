<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gcollage — Belajar Bahasa Inggris dari Nol sampai Profesional</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C4DFF">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gcollage">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1023; --bg-2:#14152B; --panel:#181A32; --panel-2:#1E2040;
  --primary:#7C4DFF; --primary-deep:#6236DB; --primary-light:#C4B5FD; --primary-tint:rgba(124,77,255,0.18);
  --secondary:#A855F7; --pink:#F472B6; --cyan:#38BDF8; --emerald:#34D399; --yellow:#FBBF24; --orange:#F59E0B;
  --teal:#2DD4BF; --fuchsia:#E879F9; --rose:#FB7185; --sky:#7DD3FC; --indigo:#A5B4FC;
  --red:#F43F5E; --green:#22C55E;
  --text:#FFFFFF; --text-soft:#B7B7C9; --text-softer:#7C7C99;
  --line:rgba(255,255,255,0.09); --line-strong:rgba(255,255,255,0.16);
  --radius:22px; --shadow:0 20px 50px -20px rgba(0,0,0,0.55);
  --glow-primary:0 0 0 1px rgba(124,77,255,0.28), 0 20px 50px -16px rgba(124,77,255,0.45);
  --shadow-hover:0 30px 60px -18px rgba(0,0,0,0.6);
  --shadow-node:0 14px 34px -12px rgba(0,0,0,0.55);
  --pulse-base:0 14px 34px -12px rgba(0,0,0,0.55);
  --fb-good:#7EE8A8; --fb-bad:#FCA5B1;
  --glow-op-1:0.55; --glow-op-2:0.4; --glow-op-3:0.32;
}
/* Light theme — adapted (not a literal invert): softer shadows, warmer glow, readable dark text on white/lavender surfaces */
[data-theme="light"]{
  --bg:#F5F5FC; --bg-2:#FFFFFF; --panel:#FFFFFF; --panel-2:#F3F2FA;
  --primary-light:#5B4FE0;
  --text:#1E1B39; --text-soft:#6B6B85; --text-softer:#9B9AB5;
  --line:rgba(30,20,70,0.09); --line-strong:rgba(30,20,70,0.18);
  --shadow:0 14px 34px -14px rgba(31,23,71,0.14);
  --glow-primary:0 10px 26px -8px rgba(109,93,231,0.4);
  --shadow-hover:0 22px 46px -16px rgba(31,23,71,0.28);
  --shadow-node:0 12px 28px -10px rgba(31,23,71,0.32);
  --pulse-base:0 12px 28px -10px rgba(31,23,71,0.32);
  --fb-good:#15803D; --fb-bad:#BE123C;
  --glow-op-1:0.22; --glow-op-2:0.16; --glow-op-3:0.14;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text); font-family:'Plus Jakarta Sans', sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;
  transition:background .35s ease, color .35s ease;
  position:relative; overflow-x:hidden;
}
h1,h2,h3,.display{font-family:'Sora', sans-serif;}
.mono{font-family:'JetBrains Mono', monospace;}
button{font-family:inherit;}
#app{min-height:100vh; position:relative; z-index:1;}

/* ============ AMBIENT GLOW BACKGROUND ============ */
.ambient-glow{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
.ambient-glow span{position:absolute; border-radius:50%; filter:blur(90px); will-change:transform;}
.ambient-glow span:nth-child(1){width:480px;height:480px;background:radial-gradient(circle,rgba(124,77,255,0.55),transparent 70%);top:-160px;left:-120px;animation:driftA 24s ease-in-out infinite;opacity:var(--glow-op-1);}
.ambient-glow span:nth-child(2){width:420px;height:420px;background:radial-gradient(circle,rgba(56,189,248,0.4),transparent 70%);top:15%;right:-160px;animation:driftB 28s ease-in-out infinite;opacity:var(--glow-op-2);}
.ambient-glow span:nth-child(3){width:400px;height:400px;background:radial-gradient(circle,rgba(168,85,247,0.32),transparent 70%);bottom:-160px;left:35%;animation:driftC 32s ease-in-out infinite;opacity:var(--glow-op-3);}
@keyframes driftA{0%,100%{transform:translate(0,0);}50%{transform:translate(60px,40px);}}
@keyframes driftB{0%,100%{transform:translate(0,0);}50%{transform:translate(-50px,55px);}}
@keyframes driftC{0%,100%{transform:translate(0,0);}50%{transform:translate(40px,-45px);}}
@media (prefers-reduced-motion: reduce){.ambient-glow span{animation:none;}}

/* ============ GLASSMORPHISM (applied to card-style surfaces) ============ */
.badge,.chat-bubble,.chat-icon-btn,.chat-text-input,.lb-btn,.lb-note,.lb-row,.learn-card,.login-card,
.mini-stat,.mission-card,.nav-item.active,.opt-img,.opt-text,.podium-stand,.profile-avatar-big,
.profile-chip,.progress-track,.pron-cell,.pron-practice-panel,.quiz-sentence,.stat-pill,.sticker-row,
.summary-stat,.task-item,.unit-node.locked,.avatar-opt,.mission-bar-wrap,.name-input,.profile-card,
.reaction-btn,.sidebar,.login-card,.essay-input,.sc-result,.essay-feedback,.feedback-box{
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
}

/* ============ SHELL / SIDEBAR ============ */
.shell{display:flex;min-height:100vh;max-width:1200px;margin:0 auto;}
.sidebar{width:230px;flex-shrink:0;background:var(--bg-2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:6px 10px 20px;}
.logo-badge{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;font-size:18px;color:#fff;flex-shrink:0;box-shadow:0 8px 20px -6px rgba(124,77,255,0.55);}
.logo-text{font-family:'Sora';font-weight:700;font-size:18px;}
.nav-item{display:flex;align-items:center;gap:12px;background:none;border:none;color:var(--text-soft);font-family:'Sora';font-weight:600;font-size:14px;padding:8px 10px;border-radius:14px;cursor:pointer;text-align:left;width:100%;}
.nav-icon-badge{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 10px -3px rgba(0,0,0,0.35);}
.nav-icon-badge svg{width:18px;height:18px;}
.nav-group-label{font-size:10.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-softer);padding:14px 12px 6px;}
.nav-item:hover{background:var(--panel-2);}
.nav-item.active{background:var(--panel);color:var(--text);border:1px solid var(--primary);}
.content{flex:1;min-width:0;padding-bottom:50px;}
.content-topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 26px 8px;gap:10px;flex-wrap:wrap;}
.stats-row{display:flex;gap:8px;flex-wrap:wrap;}
.stat-pill{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-family:'JetBrains Mono';font-weight:700;font-size:12.5px;white-space:nowrap;transition:transform .2s cubic-bezier(.22,1,.36,1);}
.stat-pill:hover{transform:translateY(-2px);}
.pill-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:11px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25), 0 3px 6px -2px rgba(0,0,0,0.35);}
.pill-badge.fire{background:linear-gradient(135deg,#FDE68A,#F59E0B);}
.pill-badge.gem{background:linear-gradient(135deg,#38BDF8,#6D5DFB);}
.pill-badge.heart{background:linear-gradient(135deg,#FB7185,#F43F5E);}
.profile-chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:6px;}
.profile-chip:hover{border-color:var(--primary);}
@media (max-width:760px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:10px 12px;gap:6px;}
  .sidebar-logo{display:none;}
  .nav-group-label{display:none;}
  .nav-item{flex-direction:column;gap:2px;font-size:10px;padding:8px 10px;white-space:nowrap;}
  .nav-icon-badge{width:28px;height:28px;border-radius:9px;}
  .nav-icon-badge svg{width:15px;height:15px;}
}

/* ============ SECTIONS ============ */
.section-pad{padding:16px 26px;}
.card-title{font-family:'Sora';font-size:15px;font-weight:600;margin:0 0 12px;color:var(--text-soft);}
.dash-greet{padding:8px 26px 4px;}
.dash-greet h1{font-size:23px;margin:0 0 2px;}
.dash-greet p{color:var(--text-soft);font-size:13px;margin:0;}

.task-list{display:flex;flex-direction:column;gap:10px;}
.task-item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 16px;}
.task-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;}
.theme-switch{width:52px;height:30px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);position:relative;cursor:pointer;flex-shrink:0;transition:background .25s ease;}
.theme-switch.on{background:linear-gradient(135deg,var(--primary),var(--secondary));}
.theme-switch-knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 3px 8px -2px rgba(0,0,0,0.4);transition:transform .25s cubic-bezier(.22,1,.36,1);}
.theme-switch.on .theme-switch-knob{transform:translateX(22px);}
.task-item.done .task-check{background:var(--green);border-color:var(--green);color:#fff;}
.task-text{font-size:13.5px;font-weight:700;}
.task-item.done .task-text{color:var(--text-softer);text-decoration:line-through;}

.dash-hero{
  margin:18px 22px 6px; border-radius:26px; overflow:hidden; position:relative;
  background:linear-gradient(120deg,#6D5DFB 0%,#8B7CF6 55%,#38BDF8 130%);
  box-shadow:0 20px 46px -16px rgba(109,93,231,0.5);
  display:grid; grid-template-columns:1.15fr 1fr; align-items:center; gap:10px;
  padding:26px 26px 22px;
}
.dash-hero-text{color:#fff; position:relative; z-index:1;}
.dash-hero-eyebrow{font-size:12px; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; color:rgba(255,255,255,0.8); margin-bottom:8px;}
.dash-hero-title{font-family:'Sora'; font-weight:700; font-size:22px; line-height:1.25; max-width:300px;}
.dash-hero-bar-row{display:flex; align-items:center; gap:10px; margin-top:16px;}
.dash-hero-bar-track{flex:1; height:8px; border-radius:99px; background:rgba(255,255,255,0.28); overflow:hidden;}
.dash-hero-bar-fill{height:100%; border-radius:99px; background:#fff;}
.dash-hero-pct{font-family:'JetBrains Mono'; font-weight:700; font-size:12.5px;}
.dash-hero-btn{
  margin-top:18px; display:inline-flex; align-items:center; gap:8px; background:#fff; color:var(--primary-deep);
  font-family:'Sora'; font-weight:700; font-size:13.5px; padding:12px 20px; border:none; border-radius:999px; cursor:pointer;
  box-shadow:0 10px 22px -8px rgba(0,0,0,0.25); transition:transform .2s cubic-bezier(.22,1,.36,1);
}
.dash-hero-btn:hover{transform:translateY(-2px);}
.dash-hero-art{position:relative; z-index:1; width:100%; height:auto;}
@media (max-width:760px){
  .dash-hero{grid-template-columns:1fr; padding:24px 22px;}
  .dash-hero-art{display:none;}
}

.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media (max-width:900px) and (min-width:761px){.choice-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:760px){.choice-grid{grid-template-columns:1fr;}}
.choice-card.pron{background:linear-gradient(135deg,#2DD4BF,#0891B2);}
.choice-card.sentence{background:linear-gradient(135deg,#818CF8,#4F46E5);}
.choice-card.mandarin{background:linear-gradient(135deg,#FBBF24,#DC2626);}
.choice-card{border:none;border-radius:24px;padding:20px 16px;text-align:left;cursor:pointer;box-shadow:var(--shadow);color:#fff;position:relative;overflow:hidden;transition:transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s cubic-bezier(.22,1,.36,1);}
.choice-card:hover{transform:translateY(-6px); box-shadow:var(--shadow-hover);}
.choice-card.vocab{background:linear-gradient(135deg,var(--primary),var(--primary-deep));}
.choice-card.grammar{background:linear-gradient(135deg,#F472B6,#DB2777);}
.choice-card.verbs{background:linear-gradient(135deg,#2DD4BF,#0F766E);}
.choice-card .cc-icon{width:52px;height:52px;}
.choice-card .cc-icon svg{width:100%;height:100%;display:block;}
.choice-card .cc-title{font-family:'Sora';font-size:17px;font-weight:700;margin-top:8px;}
.choice-card .cc-sub{font-size:11.5px;opacity:0.85;margin-top:2px;}
.choice-card .cc-bar-wrap{height:8px;background:rgba(255,255,255,0.25);border-radius:99px;margin-top:14px;overflow:hidden;}
.choice-card .cc-bar{height:100%;background:#fff;border-radius:99px;}
.choice-card .cc-pct{font-family:'JetBrains Mono';font-size:10.5px;margin-top:6px;opacity:0.85;}

.coach-card{background:linear-gradient(160deg, rgba(56,189,248,0.16), rgba(124,77,255,0.16));border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
.coach-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.coach-avatar{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#38BDF8,#7C4DFF);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px -8px rgba(56,189,248,0.55);flex-shrink:0;padding:6px;}
.coach-title{font-family:'Sora';font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;}
.coach-beta{font-size:9.5px;font-weight:800;background:var(--secondary);color:#fff;padding:2px 7px;border-radius:99px;letter-spacing:0.03em;}
.coach-msg{font-size:13px;color:var(--text-soft);line-height:1.55;margin-bottom:14px;}

.week-chart{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:6px;}
.week-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
.week-bar-wrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;}
.week-bar{width:60%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--secondary),var(--primary));min-height:4px;transition:height 1s cubic-bezier(.22,1,.36,1);}
.week-col.today .week-bar{background:linear-gradient(180deg,var(--orange),var(--red));}
.week-day{font-size:10.5px;color:var(--text-softer);font-weight:700;}
.week-val{font-family:'JetBrains Mono';font-size:9.5px;color:var(--text-softer);min-height:12px;}

.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media (max-width:600px){.mini-stats{grid-template-columns:repeat(2,1fr);}}
.mini-stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;}
.mini-stat .num{font-family:'JetBrains Mono';font-weight:700;font-size:19px;color:var(--primary-light);}
.mini-stat .lab{font-size:10px;color:var(--text-softer);margin-top:3px;}

.badges-row{display:flex;gap:12px;flex-wrap:wrap;}
.badge{display:flex;flex-direction:column;align-items:center;gap:8px;width:86px;padding:14px 8px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--text-softer);text-align:center;transition:transform .2s cubic-bezier(.22,1,.36,1);}
.badge:hover{transform:translateY(-3px);}
.badge span{font-size:24px;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel-2);}
.badge.earned{color:var(--text);}
.badge.earned span{background:linear-gradient(135deg,var(--yellow),var(--pink));box-shadow:0 10px 20px -8px rgba(251,191,36,0.55);}

.lb-btn{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px 18px;cursor:pointer;}
.lb-btn:hover{border-color:var(--primary);}
.lb-btn .l1{font-weight:700;font-family:'Sora';font-size:15px;}
.lb-btn .l2{font-size:12px;color:var(--text-softer);}

/* ============ MAP / PATH ============ */
.map-intro{padding:10px 26px 14px;}
.page-head{display:flex;align-items:center;gap:14px;margin-bottom:2px;}
.page-head-badge{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 8px 18px -6px rgba(0,0,0,0.4);}
.page-head-badge svg{width:24px;height:24px;}
.page-head h1{margin:0;}
.icon-inline{width:15px;height:15px;vertical-align:-2px;display:inline-block;margin-right:4px;}
.map-intro h1{font-size:21px;margin:0 0 4px;}
.map-intro p{color:var(--text-soft);font-size:13.5px;margin:0;line-height:1.4;}
.lang-tabs{display:flex;gap:8px;margin-top:14px;}
.lang-tab{padding:9px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--text-softer);font-family:'Sora';font-weight:600;font-size:13px;cursor:pointer;transition:all .2s ease;}
.lang-tab:hover{border-color:var(--primary);color:var(--text);}
.lang-tab.active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-color:transparent;}
.tier-header{width:100%;text-align:center;margin:22px 0 6px;}
.tier-header span{font-family:'Sora';font-weight:700;font-size:12px;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-softer);background:var(--panel);border:1px solid var(--line);padding:6px 16px;border-radius:999px;}
.path{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 20px 30px;}
.unit-block{display:flex;flex-direction:column;align-items:center;}
.unit-node-wrap{display:flex;flex-direction:column;align-items:center;transition:transform .2s ease;}
.unit-node-wrap.off-a{transform:translateX(-40px);}
.unit-node-wrap.off-b{transform:translateX(40px);}
.unit-node{width:74px;height:74px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:30px;border:none;cursor:pointer;position:relative;box-shadow:var(--shadow-node); transition:transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s cubic-bezier(.22,1,.36,1);}
.unit-node:not(.locked):hover{transform:translateY(-4px) scale(1.03);}
.unit-node.locked{background:var(--panel);color:var(--text-softer);cursor:not-allowed;box-shadow:none;border:2px dashed var(--line);}
.unit-node.current{animation:pulse 2s infinite;}
.unit-node .lock{position:absolute;bottom:-6px;right:-4px;background:var(--bg-2);border-radius:50%;padding:4px;font-size:12px;}
@keyframes pulse{0%{box-shadow:var(--pulse-base), 0 0 0 0 rgba(124,77,255,0.5);}70%{box-shadow:var(--pulse-base), 0 0 0 14px rgba(124,77,255,0);}100%{box-shadow:var(--pulse-base), 0 0 0 0 rgba(124,77,255,0);}}
.unit-title{font-family:'Sora';font-weight:600;font-size:13px;margin-top:8px;text-align:center;max-width:120px;}
.unit-sub{font-size:10.5px;color:var(--text-softer);margin-top:-2px;text-align:center;max-width:120px;}
.unit-stars{font-size:11px;margin-top:4px;}
.connector{width:6px;height:26px;background:repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 12px);}

/* ============ LESSON (fullscreen) ============ */
.fullscreen-wrap{max-width:680px;margin:0 auto;min-height:100vh;padding-bottom:50px;}
.lesson-topbar{display:flex;align-items:center;gap:14px;padding:18px 20px 10px;}
.icon-btn{background:none;border:none;color:var(--text-softer);font-size:22px;cursor:pointer;line-height:1;}
.icon-btn:hover{color:var(--text);}
.progress-track{flex:1;height:14px;background:var(--panel);border-radius:999px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));border-radius:999px;transition:width .4s ease;}
.hearts-hud{display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono';font-weight:700;font-size:15px;color:var(--red);white-space:nowrap;}
.lesson-body{padding:20px 24px 30px;}
.pill-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(139,92,246,0.18);color:var(--primary-light);font-weight:700;font-size:12px;letter-spacing:0.04em;text-transform:uppercase;padding:6px 12px;border-radius:999px;margin-bottom:14px;}
.pill-dot{width:8px;height:8px;border-radius:50%;background:currentColor;}

.learn-card{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:38px 22px;text-align:center;box-shadow:var(--shadow);margin-top:6px;}

function ensureHearts(){
  const REGEN_MS = 4*60*60*1000;
  if(state.hearts>=5){ state.heartsLastRegen = Date.now(); return; }
  const elapsed = Date.now() - (state.heartsLastRegen || Date.now());
  const gained = Math.floor(elapsed/REGEN_MS);
  if(gained>0){
    state.hearts = Math.min(5, state.hearts+gained);
    state.heartsLastRegen = (state.heartsLastRegen||Date.now()) + gained*REGEN_MS;
    saveState();
  }
}

function generateQuiz(unit, mode){
  const items = shuffle(unit.words);
  if(mode==="vocab" || mode==="mandarin" || mode==="mandarin_verbs"){
    return items.map((w,i)=>{
      const others = unit.words.filter(x=>x.en!==w.en);
      const distractors = shuffle(others).slice(0,2);
      const type = i%3;
      if(type===0){
        const options = shuffle([w, ...distractors]);
        return {type:"image", options, correctAnswer:w.en, prompt:`Yang mana artinya "${w.id}"?`, ref:w};
      } else if(type===1){
        const options = shuffle([w.id, ...distractors.map(d=>d.id)]);
        return {type:"meaning", options, correctAnswer:w.id, prompt:`Apa arti dari "${w.en}"?`, ref:w};
      } else {
        const re = new RegExp(escapeRegex(w.en), "i");
        const sentence = w.ex.replace(re, "_____");
        const options = shuffle([w.en, ...distractors.map(d=>d.en)]);
        return {type:"blank", options, correctAnswer:w.en, prompt:"Lengkapi kalimat ini:", sentence, ref:w};
      }
    });
  } else {
    return items.map((c,i)=>{
      const others = unit.words.filter(x=>x.en!==c.en);
      const type = i%2;
      if(type===0){
        const distractors = shuffle(others).slice(0,2).map(d=>d.id);
        const options = shuffle([c.id, ...distractors]);
        const p = mode==="verbs" ? `Apa arti & bentuk lampau dari "${c.en}"?` : `Apa penjelasan dari pola "${c.en}"?`;
        return {type:"meaning", options, correctAnswer:c.id, prompt:p, ref:c};
      } else {
        const options = shuffle(c.drill.options.slice());
        return {type:"drill", options, correctAnswer:c.drill.correct, prompt:"Lengkapi kalimat ini:", sentence:c.drill.sentence, ref:c};
      }
    });
  }
}
function totalSteps(unit){ return unit.words.length*2 + 2; }
function currentStepNumber(){
  const unit = CURRICULA[ui.mode][ui.unitIndex];
  if(ui.phase==="learn") return ui.learnIndex;
  if(ui.phase==="quiz") return unit.words.length + ui.quizIndex;
  if(ui.phase==="essay") return unit.words.length*2 + ui.essayIndex;
  return totalSteps(unit);
}
function buildEssayPrompts(mode, unit){

}

function evaluateSentence(prompt, textRaw){
  const text = textRaw.trim();
  if(!text) return {ok:false, msg:"Kalimatnya belum diisi. Coba tulis satu kalimat dulu ya."};
  const hasTarget = text.toLowerCase().includes(prompt.checkTarget.toLowerCase());
  if(!hasTarget) return {ok:false, msg:`Sepertinya kalimatmu belum memakai "${prompt.checkTarget}". Coba masukkan itu di kalimatmu.`};
  if(isMandarinMode(ui.mode)){
    const hanziCount = (text.match(/[\u4e00-\u9fff]/g)||[]).length;
    if(hanziCount<4) return {ok:false, msg:`Kalimatnya masih terlalu pendek. Coba tulis kalimat yang lebih lengkap dengan "${prompt.checkTarget}".`};
    const notes = [];
    if(!/[。！？]$/.test(text)) notes.push("akhiri kalimat dengan tanda baca Mandarin (。 ！ atau ？)");
    return {ok:true, msg: notes.length ? `Bagus, kamu sudah tepat memakai "${prompt.checkTarget}"! Sedikit catatan: ${notes.join(", ")}.` : `Keren! Kalimatmu sudah tepat dan memakai "${prompt.checkTarget}" dengan baik.`};
  }
  const wc = text.split(/\s+/).filter(Boolean).length;
  if(wc<3) return {ok:false, msg:`Kalimatnya masih terlalu pendek. Coba buat kalimat lengkap: subjek + kata kerja + "${prompt.checkTarget}".`};
  const notes = [];
  if(!/^[A-Z]/.test(text)) notes.push("mulai kalimat dengan huruf besar");
  if(!/[.!?]$/.test(text)) notes.push("akhiri kalimat dengan tanda baca (. ! atau ?)");
  return {ok:true, msg: notes.length ? `Bagus, kamu sudah tepat memakai "${prompt.checkTarget}"! Sedikit catatan: ${notes.join(", ")}.` : `Keren! Kalimatmu sudah tepat dan memakai "${prompt.checkTarget}" dengan baik.`};
}
function finalizeLesson(){
  const mode = ui.mode;
  const unit = CURRICULA[mode][ui.unitIndex];
  const track = state.progress[mode];
  unit.words.forEach(w=>{ track.learned[w.en]=true; });
  const stars = ui.wrongInLesson===0 ? 3 : ui.wrongInLesson<=2 ? 2 : 1;
  const prevStars = (track.units[unit.id] && track.units[unit.id].stars) || 0;
  track.units[unit.id] = { stars: Math.max(stars, prevStars) };
  if(ui.unitIndex+1 > track.unlockedCount-1 && ui.unitIndex+1 < CURRICULA[mode].length){
    track.unlockedCount = Math.max(track.unlockedCount, ui.unitIndex+2);
  }
  const xpGained = 20 + stars*10;
  state.xp += xpGained;
  ensureDaily();
  state.daily.xpEarnedToday = (state.daily.xpEarnedToday||0) + xpGained;
  if(!state.xpHistory) state.xpHistory = {};
  const today = todayStr();
  state.xpHistory[today] = (state.xpHistory[today]||0) + xpGained;
  const cutoff = new Date(Date.now()-13*86400000).toISOString().slice(0,10);
  Object.keys(state.xpHistory).forEach(d=>{ if(d<cutoff) delete state.xpHistory[d]; });
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(state.lastCompletionDate !== todayStr()){
    state.streak = (state.lastCompletionDate===yesterday) ? state.streak+1 : 1;
    state.lastCompletionDate = todayStr();
  }
  if(mode==="vocab") state.daily.vocabDone = true;
  else if(mode==="grammar") state.daily.grammarDone = true;
  else if(mode==="verbs") state.daily.verbsDone = true;
  else if(isMandarinMode(mode)) state.daily.mandarinDone = true;
  saveState();
  return {stars, xpGained};
}

function wireShell(){
  document.querySelectorAll(".nav-item").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const key = btn.dataset.nav;
      if(key==="vocab"){ ui.screen="map"; if(ui.mode!=="vocab"&&ui.mode!=="mandarin") ui.mode="vocab"; }
      else if(key==="grammar"){ ui.screen="map"; if(ui.mode!=="grammar"&&ui.mode!=="mandarin_grammar") ui.mode="grammar"; }
      else if(key==="verbs"){ ui.screen="map"; if(ui.mode!=="verbs"&&ui.mode!=="mandarin_verbs") ui.mode="verbs"; }
      else { ui.screen=key; }
      render();
    });
  });
  const chip = document.getElementById("profileChip");
  if(chip) chip.onclick = ()=>{ ui.screen="profile"; render(); };
}

function weeklyChartHTML(){
  const hist = state.xpHistory || {};
  const dayLabels = ["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(Date.now()-i*86400000);
    const key = d.toISOString().slice(0,10);
    days.push({ label: dayLabels[d.getDay()], xp: hist[key]||0, isToday: i===0 });
  }
  const maxVal = Math.max(20, ...days.map(d=>d.xp));
  return `
    <div class="section-pad">
      <div class="card-title">📈 Aktivitas Mingguan</div>
      <div class="stats-card" style="background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;">
        <div class="week-chart">
          ${days.map(d=>`
            <div class="week-col ${d.isToday?'today':''}">
              <div class="week-val">${d.xp>0?d.xp:''}</div>
              <div class="week-bar-wrap"><div class="week-bar" style="height:${Math.max(4, Math.round(d.xp/maxVal*100))}%"></div></div>
              <div class="week-day">${d.label}</div>
            </div>`).join("")}
        </div>
      </div>
    </div>`;
}

function mapHTML(mode){
  const units = CURRICULA[mode];
  const track = state.progress[mode];
  let title, desc;
  if(mode==="vocab"){ title="Rute Vocabulary"; desc="Selesaikan unit demi unit, dari sapaan dasar sampai istilah bisnis profesional."; }
  else if(mode==="grammar"){ title="Rute Grammar"; desc="Kuasai pola grammar selangkah demi selangkah, dari dasar sampai bahasa formal kantor."; }
  else if(mode==="mandarin"){ title="Rute Vocabulary Mandarin"; desc="Belajar kosakata Mandarin dari nol — sapaan, angka, keluarga, sampai frasa sehari-hari (setara HSK1–2)."; }
  else if(mode==="mandarin_grammar"){ title="Rute Grammar Mandarin"; desc="Pola kalimat dasar Mandarin — dari 是/不是 sampai struktur 把/被 (setara HSK1–4)."; }
  else if(mode==="mandarin_verbs"){ title="Rute Kata Kerja Mandarin"; desc="Kosakata kata kerja umum dalam Mandarin (kata kerja Mandarin tidak berubah bentuk seperti Inggris)."; }
  else { title="Rute Kata Kerja"; desc="Latih bentuk lampau kata kerja yang paling sering dipakai sehari-hari dan di kantor."; }

  const pair = MODE_PAIRS[mode];
  const langTabs = pair ? `
    <div class="lang-tabs">
      <button class="lang-tab ${mode===pair.en?'active':''}" data-lang-switch="${pair.en}">🇬🇧 English</button>
      <button class="lang-tab ${mode===pair.zh?'active':''}" data-lang-switch="${pair.zh}">🇨🇳 Mandarin</button>
    </div>` : "";

  let path = "";
  units.forEach((unit, idx)=>{
    if(mode==="vocab"){
      const tier = VOCAB_TIERS.find(t=>t.from===idx);
      if(tier) path += `<div class="tier-header"><span>${tier.title}</span></div>`;
    }
    if(mode==="mandarin"){
      const tier = MANDARIN_TIERS.find(t=>t.from===idx);
      if(tier) path += `<div class="tier-header"><span>${tier.title}</span></div>`;
    }
    const locked = idx >= track.unlockedCount;
    const isCurrent = idx === track.unlockedCount-1;
    const prog = track.units[unit.id];
    const offClass = idx%3===1 ? "off-a" : idx%3===2 ? "off-b" : "";
    path += `
      <div class="unit-block">
        ${idx>0 ? '<div class="connector"></div>' : ''}
        <div class="unit-node-wrap ${offClass}">
          <button class="unit-node ${locked?'locked':''} ${isCurrent?'current':''}" data-unit="${idx}"
            style="${locked?'':'background:'+unit.color+';color:#1A1330;'}" ${locked?'disabled':''}>
            ${unit.icon}${locked ? '<span class="lock">🔒</span>' : ''}
          </button>
          <div class="unit-title">${unit.title}</div>
          <div class="unit-sub">${unit.subtitle}</div>
          ${prog ? `<div class="unit-stars">${'⭐'.repeat(prog.stars)}</div>` : ''}
        </div>
      </div>`;
  });
  const badgeKey = isMandarinMode(mode) ? "mandarin" : mode;
  return `<div class="map-intro">${pageHeaderHTML(badgeKey, title, desc)}${langTabs}</div><div class="path">${path}</div>`;
}
function wireMap(mode){
  document.querySelectorAll("[data-lang-switch]").forEach(btn=>{
    btn.onclick = ()=>{ ui.mode = btn.dataset.langSwitch; render(); };
  });
  document.querySelectorAll(".unit-node:not(.locked)").forEach(btn=>{
    btn.addEventListener("click", ()=> startLesson(mode, parseInt(btn.dataset.unit)));
  });
}

      ${podiumHtml}

          ${avatarHTML(p.name, p.photo, "chip-avatar")}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
const ID_MARKERS = ["yang","dengan","tidak","saya","kamu","kita","kami","dia","mereka","ini","itu","dan","di","ke","dari","untuk","akan","sudah","belum","karena","atau","juga","ada","bisa","mau","harus","jangan","kalau","gimana","dong","sih","deh","banget","nggak","gak","enggak","aja","kok","gitu","loh","lho","nya","apa","siapa","kenapa","dimana","bagaimana","teman","kerja","hari","besok","kemarin","pagi","malam","terima","kasih","tolong","maaf","selamat","silakan","udah","emang","lagi","pengen","pingin","gue","gua","lu","lo","nanti","sekarang","semua","orang","tempat","waktu","jadi","cuma","hanya","kayak","kaya","banyak","sedikit","besar","kecil"];
function isLikelyEnglish(text){
  const words = text.toLowerCase().match(/[a-zA-Z']+/g) || [];
  if(words.length===0) return true;
  const idHits = words.filter(w=>ID_MARKERS.includes(w)).length;
  return idHits===0;
}
function postChatMessage(type, content){
  const messages = loadShared(CHAT_KEY, []);
  messages.push({ id:"m_"+Date.now(), profileId:currentProfileId, name:state.userName||"Sobat Gcollage", photo:state.avatar, type, content, ts:Date.now() });
  saveShared(CHAT_KEY, messages);
  render();
  setTimeout(()=>{ const list=document.getElementById("chatList"); if(list) list.scrollTop = list.scrollHeight; }, 50);
}
function wireChat(){
  const list = document.getElementById("chatList");
  if(list) list.scrollTop = list.scrollHeight;
  const stickerRow = document.getElementById("stickerRow");
  document.getElementById("stickerToggleBtn").onclick = ()=>{
    stickerRow.style.display = stickerRow.style.display==="none" ? "flex" : "none";
  };
  document.querySelectorAll("[data-sticker]").forEach(btn=>{
    btn.onclick = ()=> postChatMessage("sticker", btn.dataset.sticker);
  });
  const input = document.getElementById("chatInput");
  function send(){
    const text = input.value.trim();
    if(!text) return;
    if(!isLikelyEnglish(text)){
      ui.chatFailed = { text, ts: Date.now() };
      render();
      const list2 = document.getElementById("chatList");
      if(list2) list2.scrollTop = list2.scrollHeight;
      const input2 = document.getElementById("chatInput");
      if(input2) input2.value = text;
      return;
    }
    ui.chatFailed = null;
    postChatMessage("text", text);
    input.value = "";
  }
  document.getElementById("sendChatBtn").onclick = send;
  input.addEventListener("keydown", (e)=>{ if(e.key==="Enter") send(); });
  const voiceBtn = document.getElementById("voiceBtn");
  if(voiceBtn){
    voiceBtn.onclick = async ()=>{
      if(ui.chatRecording){
        mediaRecorderRef.stop();
        return;
      }
      try{
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        recordedChunksRef = [];
        mediaRecorderRef = new MediaRecorder(stream);
        mediaRecorderRef.ondataavailable = (e)=> recordedChunksRef.push(e.data);
        mediaRecorderRef.onstop = ()=>{
          const blob = new Blob(recordedChunksRef, {type:"audio/webm"});
          const reader = new FileReader();
          reader.onload = ()=>{
            postChatMessage("voice", reader.result);
          };
          reader.readAsDataURL(blob);
          stream.getTracks().forEach(t=>t.stop());
          ui.chatRecording = false;
          voiceBtn.classList.remove("recording");
          voiceBtn.innerHTML = MIC_ICON;
        };
        mediaRecorderRef.start();
        ui.chatRecording = true;
        voiceBtn.classList.add("recording");
        voiceBtn.innerHTML = STOP_ICON;
      }catch(err){
        alert("Tidak bisa mengakses mikrofon. Pastikan izin mikrofon diberikan.");
      }
    };
  }
}

const COACH_SYSTEM_PROMPT = "You are 'Coach', a warm and encouraging AI English coach inside a learning app called Gcollage, used by the Marketing team at GODA (an Indonesian EV scooter company). Chat naturally in English to help the user practice speaking/writing English. If the user writes in English and makes a grammar or word-choice mistake, gently point out the corrected version first (briefly explain why in one short clause), then continue the conversation naturally with a follow-up question. If the user writes in Indonesian, reply helpfully but kindly encourage them to try writing in English next time. Keep every reply short: 2-4 sentences maximum, friendly, casual-professional tone, no long lectures. Never say you are Claude or an Anthropic product; you are simply 'Coach' inside Gcollage.";

function coachKey(){ return "gcollage_coach_v1_" + (currentProfileId||"anon"); }
function loadCoachChat(){ return loadShared(coachKey(), []); }
function saveCoachChat(msgs){ saveShared(coachKey(), msgs); }

async function callCoachAPI(history){
  const apiMessages = history.map(m=>({ role: m.role, content: m.content }));
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 300,
      system: COACH_SYSTEM_PROMPT,
      messages: apiMessages
    })
  });
  if(!response.ok) throw new Error("API request failed: " + response.status);
  const data = await response.json();
  const textBlocks = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text);
  return textBlocks.join("\n").trim() || "Hmm, I'm not sure what to say — can you try again?";
}

/* ===================================================================
   SENTENCE PRACTICE (type or speak a sentence, get corrected)
=================================================================== */
function checkGrammarComplete(textRaw){
  const text = textRaw.trim();
  const errors = [];
  const suggestions = [];
  if(!text) return {ok:false, errors:["Kalimatnya masih kosong. Coba tulis atau ucapkan satu kalimat."], suggestions:[]};

  // Capitalization at start
  if(!/^[A-Z]/.test(text)) errors.push("Mulai kalimat dengan huruf besar.");

  // Ending punctuation
  const endsQuestion = /\?$/.test(text);
  const endsPunct = /[.!?]$/.test(text);
  if(!endsPunct) errors.push("Akhiri kalimat dengan tanda baca (. ! atau ?).");

  // Question word without question mark
  if(/^(what|where|when|who|why|how|which|whose|do|does|did|is|are|am|can|could|should|would|will)\b/i.test(text) && endsPunct && !endsQuestion){
    suggestions.push("Kalimat ini terdengar seperti pertanyaan — mungkin perlu diakhiri dengan tanda tanya (?).");
  }

  // Double spaces
  if(/ {2,}/.test(text)) errors.push("Ada spasi ganda, coba rapikan lagi.");

  // "I" capitalization
  if(/\bi\b/.test(text) && !/\bI\b/.test(text)) errors.push('Kata ganti "I" selalu ditulis dengan huruf besar.');

  // Repeated consecutive word
  const repeatedMatch = text.match(/\b(\w+)\s+\1\b/i);
  if(repeatedMatch) errors.push(`Kata "${repeatedMatch[1]}" tertulis dua kali berturut-turut.`);

  // Subject-verb agreement: he/she/it + base verb (missing -s)
  const commonVerbsBase = ["go","come","do","make","take","have","eat","drink","write","work","like","want","need","play","read","watch","study","live","open","close","sell","buy","call","send","give","get","know","think","run","speak","tell","say","leave","meet","bring","use","help","look","try","ask","feel","seem","become","show","start","stop","walk","talk","move","believe","hold","happen","carry","allow","remain","pay","hear"];
  const svBaseRe = new RegExp(`\\b(he|she|it)\\s+(${commonVerbsBase.join("|")})\\b`, "i");
  const svMatch = text.match(svBaseRe);
  if(svMatch) errors.push(`Untuk subjek "${svMatch[1]}", kata kerja biasanya ditambah -s: "${svMatch[2]}" → "${svMatch[2]}s".`);

  // Reverse subject-verb agreement: I/we/you/they + verb+s (should not have -s)
  const pluralSubjMatch = text.match(/\b(I|we|you|they)\s+([a-zA-Z]+)\b/);
  if(pluralSubjMatch){
    const verbCandidate = pluralSubjMatch[2].toLowerCase();
    if(verbCandidate.endsWith("s")){
      const base = verbCandidate.slice(0,-1);
      if(commonVerbsBase.includes(base)) errors.push(`Untuk subjek "${pluralSubjMatch[1]}", kata kerja tidak perlu -s: "${verbCandidate}" → "${base}".`);
    }
  }

  // Double auxiliary / wrong verb form after did
  const didMatch = text.match(/\bdid\s+(\w+ed)\b/i);
  if(didMatch) suggestions.push(`Setelah "did", biasanya kata kerja bentuk dasar: "did ${didMatch[1]}" → coba periksa apakah seharusnya bentuk dasar, bukan bentuk lampau.`);

  // Double negative
  if(/\bdon't\b[^.!?]*\bno\b/i.test(text) || /\bnot\b[^.!?]*\bno\b/i.test(text) || /\bdoesn't\b[^.!?]*\bnothing\b/i.test(text)){
    errors.push("Hindari dua kata negatif dalam satu kalimat (double negative).");
  }

  // a/an usage
  const needAn = text.match(/\ba\s+([aeiouAEIOU]\w*)\b/);
  if(needAn) errors.push(`Gunakan "an" sebelum kata berawalan huruf vokal: "a ${needAn[1]}" → "an ${needAn[1]}".`);
  const needA = text.match(/\ban\s+([^aeiouAEIOU\s]\w*)\b/);
  if(needA) errors.push(`Gunakan "a" sebelum kata berawalan konsonan: "an ${needA[1]}" → "a ${needA[1]}".`);

  // Common word confusions
  const confusions = [
    {re:/\btheir\s+(is|are|was|were)\b/i, msg:'"their" artinya kepemilikan; untuk "ada" gunakan "there" (contoh: "there is").'},
    {re:/\bthere\s+(book|bag|car|phone|house|idea|plan|team|scooter)\b/i, msg:'Mungkin maksudnya "their" (kepemilikan), bukan "there" (menunjuk tempat).'},
    {re:/\byour\s+(going|coming|doing|working|welcome|right|amazing)\b/i, msg:'"your" artinya kepemilikan; untuk singkatan "you are" gunakan "you\'re".'},
    {re:/\bthen\s+(better|worse|bigger|smaller|faster|slower|more|less)\b/i, msg:'Untuk perbandingan, gunakan "than", bukan "then".'},
    {re:/\bwanna\b|\bgonna\b|\bgotta\b/i, msg:'"wanna/gonna/gotta" adalah bahasa informal — untuk tulisan formal gunakan "want to/going to/got to".'},
    {re:/\bmuch\s+(people|customer|customers|store|stores|employee|employees|colleague|colleagues)\b/i, msg:'Untuk kata benda yang bisa dihitung (jamak), gunakan "many", bukan "much".'}
  ];
  confusions.forEach(c=>{ if(c.re.test(text)) suggestions.push(c.msg); });

  // Common misspellings
  const misspellings = {
    "recieve":"receive","definately":"definitely","seperate":"separate","occured":"occurred",
    "untill":"until","becuase":"because","thier":"their","adress":"address","alot":"a lot",
    "tommorow":"tomorrow","enviroment":"environment","goverment":"government",
    "succesful":"successful","begining":"beginning","wich":"which","truely":"truly"
  };
  Object.keys(misspellings).forEach(mis=>{
    if(new RegExp(`\\b${mis}\\b`, "i").test(text)) errors.push(`Kemungkinan salah eja: "${mis}" → "${misspellings[mis]}".`);
  });

  // Sentence length checks
  const wc = text.split(/\s+/).filter(Boolean).length;
  if(wc<2) errors.push("Coba buat kalimat yang lebih lengkap, minimal subjek + kata kerja.");
  if(wc>28 && !/[,;]/.test(text)) suggestions.push("Kalimatnya cukup panjang tanpa koma — coba pecah jadi dua kalimat atau tambahkan koma agar lebih mudah dibaca.");

  return {ok: errors.length===0, errors, suggestions};
}

function wireSentence(){
  const input = document.getElementById("sentenceInput");
  const recordBtn = document.getElementById("sentenceRecordBtn");
  if(recordBtn){
    recordBtn.onclick = ()=>{
      const rec = getSpeechRecognition();
      if(!rec) return;
      recordBtn.textContent = "🎙️ Mendengarkan..."; recordBtn.classList.add("recording");
      rec.onresult = (e)=>{
        let transcript = e.results[0][0].transcript.trim();
        transcript = transcript.charAt(0).toUpperCase() + transcript.slice(1);
        input.value = transcript;
      };
      rec.onerror = ()=>{ recordBtn.innerHTML = MIC_ICON + " Ucapkan Kalimat"; recordBtn.classList.remove("recording"); };
      rec.onend = ()=>{ recordBtn.innerHTML = MIC_ICON + " Ucapkan Kalimat"; recordBtn.classList.remove("recording"); };
      rec.start();
    };

  document.getElementById("checkSentenceBtn").onclick = ()=>{
    const result = checkGrammarComplete(input.value);
    const box = document.getElementById("scResult");
    box.style.display = "block";
    box.className = "sc-result " + (result.ok ? "good" : "bad");
    let html = "";
    if(result.ok && result.suggestions.length===0){
      html = "✅ Bagus! Kalimatmu sudah sesuai secara tata bahasa.";
    } else {
      if(result.errors.length){
        html += "<b>✏️ Perlu diperbaiki:</b><ul>" + result.errors.map(i=>`<li>${i}</li>`).join("") + "</ul>";
      } else {
        html += "✅ Tidak ada kesalahan tata bahasa yang jelas.";
      }
      if(result.suggestions.length){
        html += "<b>💡 Saran tambahan:</b><ul>" + result.suggestions.map(i=>`<li>${i}</li>`).join("") + "</ul>";
      }
    }
    box.innerHTML = html;
  };
}

function resizePhotoFile(file, cb){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const size = 200;
      const canvas = document.createElement("canvas");
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext("2d");
      const scale = Math.max(size/img.width, size/img.height);
      const w = img.width*scale, h = img.height*scale;
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      cb(canvas.toDataURL("image/jpeg", 0.8));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderQuiz(){
  const unit = CURRICULA[ui.mode][ui.unitIndex];
  const q = ui.quizQuestions[ui.quizIndex];
  let optionsHtml = "";
  if(q.type==="image"){
    optionsHtml = `<div class="opts-image">${q.options.map((o,i)=>`
      <div class="opt-img" data-idx="${i}"><div class="oe">${o.emoji}</div><div class="ow">${o.en}</div></div>`).join("")}</div>`;
  } else {
    optionsHtml = `<div class="opts-text">${q.options.map((o,i)=>`<div class="opt-text" data-idx="${i}">${o}</div>`).join("")}</div>`;
  }
  const sentenceHtml = (q.type==="blank"||q.type==="drill") ? `<div class="quiz-sentence">${q.sentence.replace(/_+/, '<b>_____</b>')}</div>` : "";
  document.getElementById("app").innerHTML = `<div class="fullscreen-wrap">
    ${renderTopbar(unit)}
    <div class="lesson-body">
      <span class="pill-tag"><span class="pill-dot"></span>Latihan ${ui.quizIndex+1} / ${ui.quizQuestions.length}</span>
      <div class="quiz-q">${q.prompt}</div>
      ${sentenceHtml}
      ${optionsHtml}
      <div class="feedback-box" id="fbBox"></div>
      <div class="footer-row">
        <button class="btn btn-ghost" id="skipBtn">Lompati</button>
        <button class="btn btn-primary" id="actionBtn" disabled>Periksa</button>
      </div>
    </div></div>`;
  document.getElementById("exitBtn").onclick = exitLesson;

  const optEls = document.querySelectorAll(q.type==="image" ? ".opt-img" : ".opt-text");
  const actionBtn = document.getElementById("actionBtn");
  const fbBox = document.getElementById("fbBox");
  function isCorrect(i){ return q.type==="image" ? q.options[i].en===q.correctAnswer : q.options[i]===q.correctAnswer; }

  optEls.forEach((el, i)=>{
    el.addEventListener("click", ()=>{
      if(ui.checked) return;
      optEls.forEach(e=>e.classList.remove("selected"));
      el.classList.add("selected");
      ui.selected = i;
      actionBtn.disabled = false;
    });
  });
  document.getElementById("skipBtn").onclick = ()=> advanceQuiz();
  actionBtn.onclick = ()=>{
    if(!ui.checked){
      ui.checked = true;
      const correctIdx = [...optEls].findIndex((_,i)=>isCorrect(i));
      const wasCorrect = isCorrect(ui.selected);
      optEls.forEach((el,i)=>{
        if(i===correctIdx) el.classList.add("correct");
        else if(i===ui.selected && !wasCorrect) el.classList.add("wrong");
      });
      fbBox.classList.add("show");
      const explain = (q.type==="meaning" && ui.mode!=="vocab") ? q.ref.en+": "+q.ref.id : `"${q.ref.en}" artinya "${q.ref.id}"`;
      if(wasCorrect){
        fbBox.classList.add("good");
        fbBox.textContent = "Benar! " + explain + ".";
        state.daily.correctToday = (state.daily.correctToday||0)+1;
      } else {
        state.hearts = Math.max(0, state.hearts-1);
        ui.wrongInLesson++;
        fbBox.classList.add("bad");
        fbBox.textContent = "Kurang tepat. " + explain + ". Yuk diingat lagi.";
      }
      saveState();
      actionBtn.textContent = "Lanjut";
      document.querySelector(".hearts-hud").textContent = "❤️ " + state.hearts;
    } else {
      advanceQuiz();
    }
  };
}
function advanceQuiz(){
  ui.checked = false; ui.selected = null;
  if(ui.quizIndex < ui.quizQuestions.length-1){ ui.quizIndex++; render(); }
  else { ui.phase="essay"; ui.essayIndex=0; render(); }
}

=================================================================== */
function renderEssay(){
  const unit = CURRICULA[ui.mode][ui.unitIndex];
  const p = ui.essayPrompts[ui.essayIndex];
  let promptText;
  if(ui.mode==="vocab") promptText = `Buat satu kalimat bahasa Inggris menggunakan kata <span class="kw">"${p.label}"</span> (${p.meaning}).`;
  else if(ui.mode==="grammar") promptText = `Buat satu kalimat bahasa Inggris yang menerapkan pola <span class="kw">"${p.label}"</span> — ${p.meaning}.`;
  else if(ui.mode==="mandarin"||ui.mode==="mandarin_verbs") promptText = `Buat satu kalimat Mandarin menggunakan kata <span class="kw">"${p.label}"</span> (${p.meaning}).`;
  else if(ui.mode==="mandarin_grammar") promptText = `Buat satu kalimat Mandarin yang menerapkan pola <span class="kw">"${p.label}"</span> — ${p.meaning}.`;
  else promptText = `Buat satu kalimat bahasa Inggris menggunakan bentuk lampau dari kata kerja <span class="kw">"${p.label}"</span> (${p.meaning}).`;
  document.getElementById("app").innerHTML = `<div class="fullscreen-wrap">
    ${renderTopbar(unit)}
    <div class="lesson-body">
      <span class="pill-tag"><span class="pill-dot"></span>Tulis Kalimat ${ui.essayIndex+1} / ${ui.essayPrompts.length}</span>
      <div class="essay-prompt">${promptText}</div>
      <textarea class="essay-input" id="essayInput" placeholder="Tulis kalimatmu di sini..."></textarea>
      <div class="essay-feedback" id="essayFb" style="display:none;"></div>
      <div class="footer-row">
        <button class="btn btn-ghost" id="skipEssayBtn">Lewati</button>
        <button class="btn btn-primary" id="checkEssayBtn">Periksa</button>
      </div>
    </div></div>`;
  document.getElementById("exitBtn").onclick = exitLesson;
  document.getElementById("skipEssayBtn").onclick = ()=> advanceEssay();
  let checked = false;
  document.getElementById("checkEssayBtn").onclick = ()=>{
    const input = document.getElementById("essayInput");
    const fb = document.getElementById("essayFb");
    if(!checked){
      const result = evaluateSentence(p, input.value);
      fb.style.display = "block";
      fb.className = "essay-feedback " + (result.ok ? "good" : "bad");
      fb.innerHTML = `${result.ok ? "✅" : "✏️"} ${result.msg}<div class="example">Contoh lain: "${p.ex}"</div>`;
      if(result.ok){ checked = true; document.getElementById("checkEssayBtn").textContent = "Lanjut"; }
    } else {
      advanceEssay();
    }
  };
}
function advanceEssay(){
  if(ui.essayIndex < ui.essayPrompts.length-1){ ui.essayIndex++; render(); }
  else { const result = finalizeLesson(); ui.phase="summary"; ui.starsEarned = result.stars; ui.xpGained = result.xpGained; render(); }
}

    </div></div>`;

}

function applyTheme(){
  document.body.setAttribute("data-theme", state.theme==="light" ? "light" : "dark");
}
function render(){
  applyTheme();
  ensureHearts();
  if(ui.screen==="login"){ renderLogin(); return; }
  if(ui.screen==="lesson"){
    if(ui.phase==="learn") renderLearn();
    else if(ui.phase==="quiz") renderQuiz();
    else if(ui.phase==="essay") renderEssay();
    else if(ui.phase==="summary") renderSummary();

  else if(ui.screen==="pronunciation") contentHtml = pronunciationHTML();

  else if(ui.screen==="chat") contentHtml = chatHTML();
  else if(ui.screen==="coach") contentHtml = coachHTML();
  else if(ui.screen==="settings") contentHtml = settingsHTML();
  else if(ui.screen==="profile") contentHtml = profileHTML();
  document.getElementById("app").innerHTML = shellHTML(contentHtml);
  wireShell();
  if(ui.screen==="dashboard") wireDashboard();
  else if(ui.screen==="map") wireMap(ui.mode);
  else if(ui.screen==="leaderboard") wireLeaderboard();
  else if(ui.screen==="missions") wireMissions();
  else if(ui.screen==="pronunciation") wirePronunciation();
  else if(ui.screen==="sentence") wireSentence();
  else if(ui.screen==="chat") wireChat();
  else if(ui.screen==="coach") wireCoach();
  else if(ui.screen==="settings") wireSettings();
  else if(ui.screen==="profile") wireProfile();
}
